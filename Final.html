<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>編集</title>
</head>
<body>

<h1>投稿編集</h1>

<form method="POST" action="{{ url_for('update', id=post.id) }}">
    <p>
        名前<br>
        <input type="text" name="myname" value="{{ post.myname }}" required>
    </p>

    <p>
        メール<br>
        <input type="email" name="email" value="{{ post.email }}" required>
    </p>

    <p>
        メッセージ<br>
        <textarea name="message" required>{{ post.message_main }}</textarea>
    </p>

    <button type="submit">更新</button>
</form>

<a href="{{ url_for('index') }}">戻る</a>

</body>
</html>
